name: Release
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check out WoW packager
        uses: actions/checkout@v4
        with:
          repository: BigWigsMods/packager
          ref: v2
          path: .wow-packager
          persist-credentials: false
      - name: Package addon
        run: GITHUB_EVENT_NAME=workflow_dispatch bash .wow-packager/release.sh -d -n TheArtfulDodgersLedger
      - name: Prepare build artifact
        run: cp .release/TheArtfulDodgersLedger.zip TheArtfulDodgersLedger.zip
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheArtfulDodgersLedger-${{ github.run_id }}-${{ github.run_attempt }}
          path: TheArtfulDodgersLedger.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: TheArtfulDodgersLedger-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'dist/TheArtfulDodgersLedger.zip'