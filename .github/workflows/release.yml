name: Release
on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - 'v*'

jobs:
  package:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Package addon
        run: |
          package_dir="dist/TheArtfulDodgersLedger"
          mkdir -p "$package_dir"
          cp ./*.lua ./*.toc "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          cp -R ui data "$package_dir/"
          cd dist
          zip -r ../TheArtfulDodgersLedger.zip TheArtfulDodgersLedger
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheArtfulDodgersLedger-${{ github.run_id }}-${{ github.run_attempt }}
          path: TheArtfulDodgersLedger.zip
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: TheArtfulDodgersLedger-${{ github.run_id }}-${{ github.run_attempt }}
          path: dist
      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'dist/TheArtfulDodgersLedger.zip'