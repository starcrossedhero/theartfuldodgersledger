name: Release
on:
  push:
    tags:
      - '*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package addon
        run: |
          package_dir="dist/TheArtfulDodgersLedger"
          mkdir -p "$package_dir"
          cp ./*.lua ./*.toc "$package_dir/"
          cp README.md LICENSE "$package_dir/"
          cp -R ui "$package_dir/"
          cd dist
          zip -r ../TheArtfulDodgersLedger.zip TheArtfulDodgersLedger
      - name: Upload Release
        uses: ncipollo/release-action@v1
        with:
          artifacts: 'TheArtfulDodgersLedger.zip'